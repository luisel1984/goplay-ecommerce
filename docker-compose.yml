version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: goplay-postgres
    environment:
      POSTGRES_USER: goplay
      POSTGRES_PASSWORD: goplay
      POSTGRES_DB: goplay
    ports:
      - "5432:5432"
    volumes:
      - goplay_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goplay"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: goplay-redis
    ports:
      - "6379:6379"
    volumes:
      - goplay_redis:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: goplay-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  goplay_pg:
  goplay_redis:
